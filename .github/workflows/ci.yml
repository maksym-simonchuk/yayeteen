name: CI

# P0-4 (docs/quality-gate.md §1): default-гілка репозиторію — master.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Ручний запуск з Actions-табу + форсить реєстрацію workflow у GitHub
  # (Actions увімкнено після ранніх пушів — потрібен новий workflow-коміт для індексації).
  workflow_dispatch:

env:
  PNPM_VERSION: '9.14.4'
  NODE_VERSION: '20'

jobs:
  # ─── S0 · Static (ціль < 3 хв) ──────────────────────────────────────────
  # docs/quality-gate.md §3 S0: format, secrets, audit, arch, dead-code, dup,
  # lint, typecheck — всі в одному job, послідовно.
  s0-static:
    name: S0 · Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks потребує повної git-історії для перевірки
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Format — будь-який diff = fail
      - name: Format check (prettier)
        run: pnpm format:check

      # Secrets — будь-який знахід = fail (P0-2)
      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deps audit — high/critical = fail; serialize-javascript override у root package.json
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      # Arch conformance — порушення §2.2 = fail
      - name: Architecture conformance (dependency-cruiser)
        run: pnpm depcruise

      # Dead code — новий unused export = fail
      - name: Dead code (knip)
        run: pnpm knip

      # Duplication — новий клон > 25 рядків = fail
      - name: Duplication (jscpd)
        run: pnpm dup

      # Lint — error = fail
      - name: Lint
        run: pnpm lint

      # Typecheck — strict + noUncheckedIndexedAccess
      - name: Typecheck
        run: pnpm typecheck

  # ─── S1 · Unit (ціль < 2 хв, без dependsOn ^build — P0-6) ──────────────
  # docs/quality-gate.md §3 S1: packages/method тести, coverage у CI.
  s1-unit:
    name: S1 · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # P0-4: пакет перейменовано clinical → method; coverage-шлях виправлено.
      # Coverage-пороги enforced у Phase 1 (S1) — packages/method/vitest.config.ts.
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: packages/method/coverage/
          if-no-files-found: warn

  # ─── S2 · Integration + DB (ціль < 6 хв) ────────────────────────────────
  # docs/quality-gate.md §3 S2: supabase local, RLS-матриця, schema-contract,
  # API-інтеграційні тести (реальна БД + фейковий AnthropicPort).
  s2-integration:
    name: S2 · Integration + DB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Supabase CLI — версія запінена (caveat: gen types формат v2.x).
      # При оновленні CLI перевір структуру Relationships у gen types output.
      - uses: supabase/setup-cli@v1
        with:
          version: 1.207.9

      # Запуск Supabase local (Docker обов'язковий на runner — ubuntu-latest має його).
      - name: Start Supabase local
        run: supabase start

      # Міграції з нуля + seed (supabase/seed.sql: therapist seed для RLS-тестів).
      - name: Reset DB (migrations + seed)
        run: supabase db reset --local

      # Schema-contract: дрейф types.ts → fail (docs/quality-gate.md §S2).
      - name: Schema contract check
        run: bash scripts/check-db-types.sh

      # S2 + S1 unit-тести (integration env-gated через SUPABASE_TEST_URL).
      # Стандартні demo-ключі Supabase local — не секрети.
      - name: Run tests (unit + integration)
        env:
          SUPABASE_TEST_URL: 'http://127.0.0.1:54321'
          SUPABASE_TEST_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0'
          SUPABASE_TEST_SERVICE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU'
          # SESSION_TOKEN_SECRET: dev-фолбек активний у тестах (NODE_ENV != production)
          ANTHROPIC_PROMPT_VERSION: 'v1.8'
        run: pnpm --filter @ya-ye/teen test

  # ─── S6 · Method/AI gates ───────────────────────────────────────────────
  # docs/quality-gate.md §3 S6: crisis recall, prompt snapshots, mode contract,
  # response-antipatterns, asymmetry fixation — окремий named check для
  # required-конфігурації фази 3. Метод-тести також ганяються в s1-unit —
  # S6 = ізольований named check для гейтингу methodology-only змін.
  s6-method:
    name: S6 · Method/AI gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run method tests (vitest)
        working-directory: packages/method
        run: pnpm vitest run --coverage

  # ─── S3 · E2E-флоу (Playwright) ──────────────────────────────────────────
  # docs/quality-gate.md §3 S3: E2E-флоу, a11y, проти next build (demo-режим).
  # Anthropic мокається через page.route() у playwright-тестах.
  # SUPABASE env: не потрібен у demo-режимі (демо-флоу без DB).
  s3-e2e:
    name: S3 · E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: apps/teen

      # Build teen у demo-режимі (без Supabase env).
      # ANTHROPIC_API_KEY не потрібен — Anthropic мокається у playwright через page.route().
      - name: Build teen (demo mode)
        working-directory: apps/teen
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
          ANTHROPIC_PROMPT_VERSION: 'v1.8'
        run: pnpm build

      - name: Run E2E tests (project=e2e)
        working-directory: apps/teen
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
          ANTHROPIC_PROMPT_VERSION: 'v1.8'
        run: npx playwright test --project=e2e

  # ─── S4 · Visual regression (Playwright toHaveScreenshot) ────────────────
  # docs/quality-gate.md §3 S4: viewport 375/768/1280, uk locale,
  # prefers-reduced-motion, maxDiffPixelRatio 0.01.
  # КОМЕНТАР: не required до стабілізації базлайнів
  # (linux-базлайни — fix-forward першим прогоном).
  s4-visual:
    name: S4 · Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: apps/teen

      - name: Build teen (demo mode)
        working-directory: apps/teen
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
          ANTHROPIC_PROMPT_VERSION: 'v1.8'
        run: pnpm build

      - name: Run visual regression tests (project=visual)
        working-directory: apps/teen
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
          ANTHROPIC_PROMPT_VERSION: 'v1.8'
        run: npx playwright test --project=visual

      # Завантажуємо скріншоти і test-results при падінні для дебагу базлайнів.
      - name: Upload visual test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-test-results
          path: |
            apps/teen/test-results/
            apps/teen/playwright-report/
          if-no-files-found: warn

  # ─── S7 · Build + budget ─────────────────────────────────────────────────
  # docs/quality-gate.md §3 S7: turbo build --affected зелений,
  # size-limit chat <= 160 kB gz, Lighthouse CI perf >= 90, a11y = 100.
  # PWA-аудит (SW не кешує /api/* і SSE) — e2e/pwa-sw.spec.ts, ганяється у s3-e2e.
  s7-budget:
    name: 'S7 · Build + budget'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 потрібен для turbo --affected (порівняння з base SHA)
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # docs/quality-gate.md §3 S7: turbo build --affected — обов'язково зелений.
      # TURBO_SCM_BASE — базова SHA для визначення affected-пакетів (turbo 2.x).
      - name: Build (turbo --affected)
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
          ANTHROPIC_PROMPT_VERSION: 'v1.8'
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: pnpm turbo run build --affected

      # Budget і LHCI потребують apps/teen/.next навіть коли teen не affected.
      # Кеш-хіт якщо вже збілджено у попередньому кроці.
      - name: Ensure teen build
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
          ANTHROPIC_PROMPT_VERSION: 'v1.8'
        run: pnpm turbo run build --filter=@ya-ye/teen

      # docs/quality-gate.md §3 S7: chat <= 160 kB gz.
      # pnpm budget визначено у кореневому package.json → scripts/check-bundle-budget.mjs
      - name: Bundle budget (chat <= 160 kB gz)
        run: pnpm budget

      # docs/quality-gate.md §3 S7: Lighthouse CI perf >= 90, a11y = 100.
      # PWA-аудит SW (не кешує /api/*) — окремий тест у s3-e2e (e2e/pwa-sw.spec.ts).
      - name: Lighthouse CI (perf >= 90, a11y = 100)
        working-directory: apps/teen
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
          ANTHROPIC_PROMPT_VERSION: 'v1.8'
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: pnpm lighthouse

  # ─── S5 · Security (SAST) ────────────────────────────────────────────────
  # docs/quality-gate.md §3 S5: semgrep OWASP top-10 + кастомні правила.
  # Кастомні правила (заборона SERVICE_ROLE_KEY поза server/adapters,
  # PII у console.log тощо) — у .semgrep/ (створює агент C).
  # Цей job тільки запускає semgrep — правила не генерує.
  s5-security:
    name: S5 · Security (SAST)
    runs-on: ubuntu-latest
    # semgrep/semgrep-action@v2 не існує (action deprecated) —
    # офіційний шлях: container-образ semgrep + semgrep scan.
    container:
      image: semgrep/semgrep:1.165.0
    steps:
      - uses: actions/checkout@v4

      - name: SAST scan (semgrep)
        # OWASP top-10 ruleset + кастомні правила проєкту (.semgrep/)
        # docs/quality-gate.md §S5: будь-яка знахідка → --error → fail
        run: semgrep scan --config p/owasp-top-ten --config .semgrep/ --error --metrics=off
